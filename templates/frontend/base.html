{% load static %}
<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Instagram-style chat application — connect, message, and share.">
    <title>ChatApp — Connect &amp; Message</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ══════════════════════════════════════════════════════
         FLASH-PREVENTION: Apply saved theme BEFORE paint.
         This script runs synchronously so there is zero flash.
    ══════════════════════════════════════════════════════ -->
    <script>
        (function () {
            var saved = localStorage.getItem('chatapp-theme');
            var html  = document.documentElement;
            if (saved === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
            } else {
                // Default → dark
                html.classList.remove('light');
                html.classList.add('dark');
            }
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // ── Class-based dark mode ──────────────────────────
            darkMode: 'class',

            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    },

                    // ── Brand / Primary palette ───────────────
                    colors: {
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        },
                        // ── Light mode surfaces ───────────────
                        light: {
                            bg:        '#f1f5f9',   // slate-100
                            surface:   '#ffffff',
                            surface2:  '#f8fafc',
                            border:    '#e2e8f0',
                            border2:   '#cbd5e1',
                            text:      '#0f172a',
                            muted:     '#64748b',
                            faint:     '#94a3b8',
                        },
                        // ── Dark mode surfaces ────────────────
                        dark: {
                            bg:        '#0d1117',
                            surface:   '#161b22',
                            surface2:  '#1c2230',
                            border:    '#21262d',
                            border2:   '#30363d',
                            text:      '#e6edf3',
                            muted:     '#8b949e',
                            faint:     '#484f58',
                        },
                    },

                    // ── Extended shadows ──────────────────────
                    boxShadow: {
                        'glass-light': '0 4px 24px rgba(99,102,241,0.08), 0 1px 4px rgba(0,0,0,0.06)',
                        'glass-dark':  '0 8px 32px rgba(0,0,0,0.5)',
                        'glow':        '0 0 24px rgba(99,102,241,0.35)',
                        'glow-sm':     '0 0 12px rgba(99,102,241,0.25)',
                        'card-light':  '0 1px 8px rgba(0,0,0,0.08)',
                        'card-dark':   '0 4px 24px rgba(0,0,0,0.4)',
                    },

                    // ── Animations ───────────────────────────
                    animation: {
                        'fade-in':       'fadeIn 0.25s ease-out',
                        'slide-up':      'slideUp 0.3s ease-out',
                        'pulse-soft':    'pulseSoft 2.5s ease-in-out infinite',
                        'bounce-in':     'bounceIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275)',
                        'theme-spin':    'themeSpin 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn:     { '0%': { opacity:'0', transform:'translateY(8px)' },   '100%': { opacity:'1', transform:'translateY(0)' } },
                        slideUp:    { '0%': { opacity:'0', transform:'translateY(20px)' },  '100%': { opacity:'1', transform:'translateY(0)' } },
                        pulseSoft:  { '0%,100%': { opacity:'1' },                           '50%':  { opacity:'0.55' } },
                        bounceIn:   { '0%': { opacity:'0', transform:'scale(0.82)' },       '100%': { opacity:'1', transform:'scale(1)' } },
                        themeSpin:  { '0%': { transform:'rotate(-180deg) scale(0.5)', opacity:'0' }, '100%': { transform:'rotate(0deg) scale(1)', opacity:'1' } },
                    },
                },
            },
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>

<!--
    Body uses semantic CSS variables so every themed component
    just references --clr-bg, --clr-surface, etc.
    Tailwind dark: classes are used for Tailwind utilities.
-->
<body class="font-sans antialiased transition-colors duration-300
             bg-light-bg dark:bg-dark-bg
             text-light-text dark:text-dark-text">

{% block content %}{% endblock %}

<!-- theme.js must load before other scripts so toggleTheme() is available -->
<script src="{% static 'frontend/js/theme.js' %}"></script>

{% block scripts %}{% endblock %}

<!-- Boot Lucide icons after DOM is ready -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.lucide) lucide.createIcons();
    });
</script>

</body>
</html>
